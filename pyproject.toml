[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder-cli"
version = "0.1.0"
description = "Minimal Textual Pathfinder CLI with simple fallback mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58.0",
    "rich>=14.0.0",
]

[project.scripts]
pathfinder = "pathfinder_cli.__main__:main"
pathfinder-cli = "pathfinder_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["pathfinder_cli*"]
